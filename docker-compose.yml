services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    restart: always
    ports:
      - '127.0.0.1:4174:4174'
    env_file:
      - .env
    environment:
      - PORT=4174

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: ['tunnel', '--no-autoupdate', 'run', '--token', '${TUNNEL_TOKEN}']
    depends_on:
      - app

  bot:
    build:
      context: .
      dockerfile: Dockerfile
      target: bot
    restart: always
    env_file:
      - .env

  reminders:
    build:
      context: .
      dockerfile: Dockerfile
      target: bot
    restart: always
    command:
      - '/bin/sh'
      - '-c'
      - |-
        npx tsx scripts/reminders.ts || echo "[reminders] Initial job failed; will try again at next schedule";
        while true; do
          now=$$(date -u +%s);
          target=$$(( (now / 86400) * 86400 + 5 * 3600 )); # 05:00 UTC == 08:00 MSK
          if [ $$now -ge $$target ]; then
            target=$$((target + 86400));
          fi;
          sleep_seconds=$$((target - now));
          echo "[reminders] Sleeping $$sleep_seconds seconds until next 08:00 MSK run";
          sleep $$sleep_seconds;
          npx tsx scripts/reminders.ts || echo "[reminders] Job failed; will retry tomorrow";
        done
    env_file:
      - .env

  migrate:
    profiles:
      - local
      - external
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    user: root
    command:
      [
        'sh',
        '-c',
        'node_modules/.bin/prisma generate && node_modules/.bin/prisma migrate deploy',
      ]
    restart: 'no'
    env_file:
      - .env

  db:
    profiles:
      - local
    image: postgres:18-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-corpcoreai}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
