version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/corpcoreai?schema=public
    depends_on:
      - db

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["node", "scripts/bot.js"] # Note: You might need to compile scripts/bot.ts first or use ts-node in Docker
    restart: always
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/corpcoreai?schema=public
    depends_on:
      - db

  reminders:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    command:
      - "/bin/sh"
      - "-c"
      - >-
        while true; do
          now=$(date -u +%s);
          target=$(( (now / 86400) * 86400 + 5 * 3600 ));
          if [ $now -ge $target ]; then target=$((target + 86400)); fi;
          sleep_seconds=$((target - now));
          sleep $sleep_seconds;
          pnpm reminders;
        done
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/corpcoreai?schema=public
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: corpcoreai
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
