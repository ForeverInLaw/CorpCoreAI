services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    restart: always
    ports:
      - "127.0.0.1:3005:3000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/corpcoreai?schema=public
    depends_on:
      migrate:
        condition: service_completed_successfully

  bot:
    build:
      context: .
      dockerfile: Dockerfile
      target: bot
    restart: always
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/corpcoreai?schema=public
    depends_on:
      migrate:
        condition: service_completed_successfully

  reminders:
    build:
      context: .
      dockerfile: Dockerfile
      target: bot
    restart: always
    command:
      - "/bin/sh"
      - "-c"
      - |-
        npx tsx scripts/reminders.ts || echo "[reminders] Initial job failed; will try again at next schedule";
        while true; do
          now=$$(date -u +%s);
          target=$$(( (now / 86400) * 86400 + 5 * 3600 )); # 05:00 UTC == 08:00 MSK
          if [ $$now -ge $$target ]; then
            target=$$((target + 86400));
          fi;
          sleep_seconds=$$((target - now));
          echo "[reminders] Sleeping $$sleep_seconds seconds until next 08:00 MSK run";
          sleep $$sleep_seconds;
          npx tsx scripts/reminders.ts || echo "[reminders] Job failed; will retry tomorrow";
        done
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/corpcoreai?schema=public
    depends_on:
      migrate:
        condition: service_completed_successfully

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    command: ["node", "-e", "require('child_process').execSync('npx prisma migrate deploy', {stdio:'inherit'})"]
    restart: "no"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/corpcoreai?schema=public
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: corpcoreai
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
